[pytest]
# The globally installed `gltest` pytest plugin (a GenLayer live-network test
# helper unrelated to this repo) imports `collections.abc.Buffer`, which only
# exists on Python >= 3.12, and crashes plugin auto-discovery on Python 3.9
# environments. This repo's contract tests do not use gltest at all -- they
# run against tests/contract/fakes.py, a local lightweight stand-in -- so we
# explicitly disable that plugin's autoload for this test suite.
addopts = -p no:gltest
testpaths = tests/contract
